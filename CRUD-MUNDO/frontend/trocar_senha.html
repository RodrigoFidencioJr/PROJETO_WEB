<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trocar senha - CRUD Mundo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">
<main class="container-login">
    <div class="cartao cartao-login">
        <h2>Trocar senha</h2>
        <p class="texto-apoio">Por segurança, defina uma nova senha para continuar.</p>
        <div id="mensagem" class="mensagem"></div>
        <form id="form-trocar-senha">
            <div class="campo largo">
                <label for="senha-atual">Senha atual</label>
                <input type="password" id="senha-atual" autocomplete="current-password" required>
            </div>
            <div class="campo largo">
                <label for="senha-nova">Nova senha</label>
                <input type="password" id="senha-nova" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="campo largo">
                <label for="senha-nova-confirma">Confirmar nova senha</label>
                <input type="password" id="senha-nova-confirma" autocomplete="new-password" minlength="6" required>
            </div>
            <button type="submit" class="btn-primario btn-largo">Salvar nova senha</button>
        </form>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/trocar-senha.js"></script>
</body>
</html>
