<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários - CRUD Mundo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>CRUD Mundo</h1>
    <nav>
        <a href="index.html">Início</a>
        <a href="continentes.html">Continentes</a>
        <a href="paises.html">Países</a>
        <a href="cidades.html">Cidades</a>
        <a href="governantes.html">Governantes</a>
        <a href="usuarios.html" class="ativo somente-admin">Usuários</a>
        <a href="logs.html" class="somente-admin">Logs</a>
    </nav>
    <div class="area-usuario">
        <span id="usuario-logado"></span>
        <button id="btn-logout" class="btn-logout">Sair</button>
    </div>
</header>

<main>
    <div id="mensagem" class="mensagem"></div>

    <div class="cartao">
        <h2 id="titulo-form">Novo usuário</h2>
        <form id="form-usuario">
            <div class="grade-formulario">
                <input type="hidden" id="usuario-username-original">
                <div class="campo">
                    <label for="usuario-username">Username *</label>
                    <input type="text" id="usuario-username" maxlength="30" required>
                </div>
                <div class="campo">
                    <label for="usuario-nome">Nome *</label>
                    <input type="text" id="usuario-nome" maxlength="80" required>
                </div>
                <div class="campo">
                    <label for="usuario-senha" id="label-usuario-senha">Senha *</label>
                    <input type="password" id="usuario-senha" autocomplete="new-password">
                </div>
                <div class="campo">
                    <label for="usuario-tipo">Tipo</label>
                    <select id="usuario-tipo">
                        <option value="U">Usuário comum</option>
                        <option value="A">Administrador</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="usuario-status">Status</label>
                    <select id="usuario-status">
                        <option value="A">Ativo</option>
                        <option value="I">Inativo</option>
                        <option value="B">Bloqueado</option>
                    </select>
                </div>
                <div class="acoes-formulario">
                    <button type="submit" class="btn-primario">Salvar</button>
                    <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar edição</button>
                </div>
            </div>
        </form>
    </div>

    <div class="cartao">
        <h2>Usuários cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Username</th>
                    <th>Tipo</th>
                    <th>Status</th>
                    <th>Tentativas</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-usuarios"></tbody>
        </table>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
