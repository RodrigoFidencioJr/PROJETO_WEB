<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cidades - CRUD Mundo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>CRUD Mundo</h1>
    <nav>
        <a href="index.html">Início</a>
        <a href="continentes.html">Continentes</a>
        <a href="paises.html">Países</a>
        <a href="cidades.html" class="ativo">Cidades</a>
        <a href="governantes.html">Governantes</a>
    </nav>
</header>

<main>
    <div id="mensagem" class="mensagem"></div>

    <div class="cartao">
        <h2 id="titulo-form">Nova cidade</h2>
        <form id="form-cidade">
            <div class="grade-formulario">
                <input type="hidden" id="cidade-id">
                <div class="campo largo">
                    <label for="cidade-nome">Nome *</label>
                    <input type="text" id="cidade-nome" required>
                </div>
                <div class="campo">
                    <label for="cidade-pais">País *</label>
                    <select id="cidade-pais" required></select>
                </div>
                <div class="campo">
                    <label for="cidade-governante">Governante</label>
                    <select id="cidade-governante">
                        <option value="">Nenhum</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="cidade-populacao">População</label>
                    <input type="number" id="cidade-populacao" min="0">
                </div>
                <div class="campo">
                    <label for="cidade-area">Área (km²)</label>
                    <input type="number" id="cidade-area" min="0" step="0.01">
                </div>
                <div class="campo">
                    <label for="cidade-clima">Clima</label>
                    <input type="text" id="cidade-clima">
                </div>
                <div class="campo">
                    <label for="cidade-fundacao">Data de fundação</label>
                    <input type="date" id="cidade-fundacao">
                </div>
                <div class="acoes-formulario">
                    <button type="submit" class="btn-primario">Salvar</button>
                    <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar edição</button>
                </div>
            </div>
        </form>
    </div>

    <div class="cartao">
        <h2>Cidades cadastradas</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>País</th>
                    <th>Governante</th>
                    <th>População</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-cidades"></tbody>
        </table>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/cidades.js"></script>
</body>
</html>
