<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Países - CRUD Mundo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>CRUD Mundo</h1>
    <nav>
        <a href="index.html">Início</a>
        <a href="continentes.html">Continentes</a>
        <a href="paises.html" class="ativo">Países</a>
        <a href="cidades.html">Cidades</a>
        <a href="governantes.html">Governantes</a>
    </nav>
</header>

<main>
    <div id="mensagem" class="mensagem"></div>

    <div class="cartao">
        <h2 id="titulo-form">Novo país</h2>
        <form id="form-pais">
            <div class="grade-formulario">
                <input type="hidden" id="pais-id">
                <div class="campo largo">
                    <label for="pais-nome">Nome *</label>
                    <input type="text" id="pais-nome" required>
                </div>
                <div class="campo">
                    <label for="pais-continente">Continente *</label>
                    <select id="pais-continente" required></select>
                </div>
                <div class="campo">
                    <label for="pais-governante">Governante</label>
                    <select id="pais-governante">
                        <option value="">Nenhum</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="pais-populacao">População</label>
                    <input type="number" id="pais-populacao" min="0">
                </div>
                <div class="campo">
                    <label for="pais-area">Área (km²)</label>
                    <input type="number" id="pais-area" min="0" step="0.01">
                </div>
                <div class="campo">
                    <label for="pais-idioma">Idioma</label>
                    <input type="text" id="pais-idioma">
                </div>
                <div class="campo">
                    <label for="pais-clima">Clima</label>
                    <input type="text" id="pais-clima">
                </div>
                <div class="campo">
                    <label for="pais-regime">Regime político</label>
                    <input type="text" id="pais-regime">
                </div>
                <div class="campo">
                    <label for="pais-moeda">Moeda</label>
                    <input type="text" id="pais-moeda">
                </div>
                <div class="acoes-formulario">
                    <button type="submit" class="btn-primario">Salvar</button>
                    <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar edição</button>
                </div>
            </div>
        </form>
    </div>

    <div class="cartao">
        <h2>Países cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Continente</th>
                    <th>Governante</th>
                    <th>População</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-paises"></tbody>
        </table>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/paises.js"></script>
</body>
</html>
